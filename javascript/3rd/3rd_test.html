<!DOCTYPE html>

            body {
                font-size: 1.9em;

            }
        </style>
    </head>
  <body>

        <!-- <h1>자바 스크립트 3주차 수업입니다.</h1> -->

            var age = prompt("출생년도를 입력하세요");
            document.write("<b><big>" + (2026 - age) + "</big></b>살 입니다.");
        </script>
    </body>
</html>
