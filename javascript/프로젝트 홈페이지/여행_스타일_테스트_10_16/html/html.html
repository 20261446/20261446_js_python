<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 여행 스타일 테스트</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-6 sm:py-10 px-4">

    <div id="app" class="w-full max-w-lg mx-auto">
        
        <!-- ==================== SCREEN 1: INTRO ==================== -->
        <div id="screen-intro" class="fade-in glass-card p-6 sm:p-9 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-amber-400 via-orange-500 to-amber-600"></div>
            
            <div class="inline-block px-3.5 py-1.5 rounded-full bg-amber-50 text-amber-800 font-bold text-xs mb-3 border border-amber-200">
                ✨ 나의 여행 스타일 찾기
            </div>

            <h1 class="font-title mb-2">나의 여행 취향 찾기</h1>
            <p class="text-xs sm:text-sm text-slate-500 mb-6 font-medium">나는 어떤 여행자일까?</p>
            
            <!-- 대표 여행 이미지 -->
            <div class="w-full mb-7 overflow-hidden rounded-2xl shadow-md border border-slate-100">
                <img
                    src="https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=900&q=85"
                    alt="여행 가방과 카메라"
                    class="w-full h-48 sm:h-56 object-cover rounded-2xl hover:scale-105 transition-transform duration-500"
                >
            </div>

            <!-- 테스트 시작 버튼 -->
            <button onclick="startTest()" class="w-full py-4 bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 hover:from-amber-600 hover:to-orange-600 text-white font-bold rounded-2xl shadow-lg shadow-orange-500/25 transition-all text-base sm:text-lg flex items-center justify-center space-x-2">
                <span>테스트 시작</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
            </button>
            
            <!-- 개발자용 랜덤 결과 바로가기 -->
            <button
                type="button"
                onclick="showRandomTravelResult()"
                class="w-full mt-3 py-3 border-2 border-dashed border-amber-300 text-amber-700 font-bold rounded-xl hover:bg-amber-50/60 transition-all text-xs sm:text-sm"
            >
                🛠️ 개발자용: 랜덤 결과 보기
            </button>
        </div>

        <!-- ==================== SCREEN 2: QUESTIONS ==================== -->
        <div id="screen-question" class="hidden fade-in glass-card p-6 sm:p-8 relative">
            
            <!-- 진행률 표시 바 및 헤더 -->
            <div class="mb-6">
                <div class="flex justify-between items-center mb-2">
                    <span id="q-topic-title" class="text-xs font-bold text-amber-800 bg-amber-100/80 px-3 py-1 rounded-full uppercase tracking-wider border border-amber-200">[주제 타이틀]</span>
                    <span id="q-progress-text" class="text-xs font-extrabold text-amber-600">1 / 18</span>
                </div>
                <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-200/60">
                    <div id="progress-bar" class="bg-gradient-to-r from-amber-500 to-orange-500 h-full rounded-full transition-all duration-300 shadow-sm" style="width: 5.5%;"></div>
                </div>
            </div>
            
            <!-- 질문 문구 박스 -->
            <div class="bg-gradient-to-b from-amber-50/40 to-orange-50/20 border border-amber-100 rounded-2xl p-6 sm:p-8 min-h-[140px] flex items-center justify-center text-center mb-7 shadow-inner relative">
                <h2 id="question-text" class="text-slate-800 leading-snug">
                    "[여기에 1번 질문을 입력하세요]"
                </h2>
            </div>
            
            <!-- 5점 척도 선택지 버튼 영역 (모든 원과 텍스트의 중심선 수평 일치) -->
            <div id="options-container" class="grid grid-cols-5 gap-1 sm:gap-2 mb-6 min-h-[110px] px-1">
                <!-- 자바스크립트로 동적 렌더링 -->
            </div>
            
            <div class="flex justify-between text-[11px] font-bold text-slate-400 px-1 pt-1 border-t border-slate-100">
                <span>👈 전혀 아니다</span>
                <span>매우 그러함 👉</span>
            </div>
        </div>

        <!-- ==================== SCREEN 3: RESULT ==================== -->
        <div id="screen-result" class="hidden fade-in glass-card p-6 sm:p-9 relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-amber-400 via-orange-500 to-amber-600"></div>
            
            <!-- 성격 유형 제목 영역 -->
            <div class="text-center mb-6">
                <span class="text-xs font-bold text-amber-800 bg-amber-100/80 px-3.5 py-1.5 rounded-full uppercase tracking-wide border border-amber-200">
                    ✨ 나의 여행 스타일
                </span>
                <h2 id="result-title" class="font-title text-2xl sm:text-3xl font-extrabold text-slate-900 mt-3 mb-3">
                    [성격 유형 네이밍 1]
                </h2>
                <p
                    id="result-type-description"
                    class="mt-2 text-sm leading-relaxed text-left shadow-sm"
                >
                    여행 유형 설명이 여기에 표시됩니다.
                </p>
            </div>
            
            <!-- AI 팩폭 한마디 박스 -->
            <div class="bg-gradient-to-r from-amber-50 to-orange-50/60 border border-amber-200/80 rounded-2xl p-4 sm:p-5 mb-5 shadow-sm">
                <div class="text-xs font-bold text-amber-900 mb-1 flex items-center space-x-1">
                    <span>🤖</span>
                    <span>AI의 팩폭 한마디</span>
                </div>
                <p id="result-ai-comment" class="text-sm font-medium italic">
                    "[AI 팩폭 문구 1번을 입력하세요]"
                </p>
            </div>
            
            <!-- 맞춤 추천 여행지 카드 -->
            <div class="bg-slate-50/90 border border-slate-200/80 rounded-2xl p-5 mb-5 shadow-sm">
                <div class="text-xs font-bold text-amber-700 mb-1.5 flex items-center space-x-1">
                    <span>📍</span>
                    <span>유형별 맞춤 지역 추천</span>
                </div>
                <div id="result-region" class="text-base sm:text-lg font-bold text-slate-800">
                    추천 지역: [추천 지역 1번 입력]
                </div>
            </div>
            
            <!-- 스타일별 맞춤 체크리스트 -->
            <div class="bg-slate-50/90 border border-slate-200/80 rounded-2xl p-5 mb-6 shadow-sm">
                <div class="text-xs font-bold text-slate-700 mb-3 flex items-center space-x-1">
                    <span>☑️</span>
                    <span>스타일별 맞춤 체크리스트</span>
                </div>
                <ul id="result-checklist" class="space-y-2 text-xs sm:text-sm text-slate-600">
                    <!-- 자바스크립트로 동적 렌더링 -->
                </ul>
            </div>
            
            <!-- 다시하기 버튼 -->
            <button onclick="restartTest()" class="w-full py-4 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-2xl transition-all shadow-lg text-sm sm:text-base flex items-center justify-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                <span>테스트 다시하기</span>
            </button>
        </div>

    </div>

    <script>
        // 1. [질문 데이터 - 사용자 수정 영역]
        const questionsData = [
            { topic: "주제 1. 주제명 (1/3)", q: "[여기에 1번 질문을 입력하세요]" },
            { topic: "주제 1. 주제명 (2/3)", q: "[여기에 2번 질문을 입력하세요]" },
            { topic: "주제 1. 주제명 (3/3)", q: "[여기에 3번 질문을 입력하세요]" },
            { topic: "주제 2. 주제명 (1/3)", q: "[여기에 4번 질문을 입력하세요]" },
            { topic: "주제 2. 주제명 (2/3)", q: "[여기에 5번 질문을 입력하세요]" },
            { topic: "주제 2. 주제명 (3/3)", q: "[여기에 6번 질문을 입력하세요]" },
            { topic: "주제 3. 주제명 (1/3)", q: "[여기에 7번 질문을 입력하세요]" },
            { topic: "주제 3. 주제명 (2/3)", q: "[여기에 8번 질문을 입력하세요]" },
            { topic: "주제 3. 주제명 (3/3)", q: "[여기에 9번 질문을 입력하세요]" },
            { topic: "주제 4. 주제명 (1/3)", q: "[여기에 10번 질문을 입력하세요]" },
            { topic: "주제 4. 주제명 (2/3)", q: "[여기에 11번 질문을 입력하세요]" },
            { topic: "주제 4. 주제명 (3/3)", q: "[여기에 12번 질문을 입력하세요]" },
            { topic: "주제 5. 주제명 (1/3)", q: "[여기에 13번 질문을 입력하세요]" },
            { topic: "주제 5. 주제명 (2/3)", q: "[여기에 14번 질문을 입력하세요]" },
            { topic: "주제 5. 주제명 (3/3)", q: "[여기에 15번 질문을 입력하세요]" },
            { topic: "주제 6. 주제명 (1/3)", q: "[여기에 16번 질문을 입력하세요]" },
            { topic: "주제 6. 주제명 (2/3)", q: "[여기에 17번 질문을 입력하세요]" },
            { topic: "주제 6. 주제명 (3/3)", q: "[여기에 18번 질문을 입력하세요]" }
        ];

        // 2. [결과 유형 데이터 - 사용자 수정 영역]
        const resultsData = [
            { 
                title: "[성격 유형 네이밍 1]", 
                desc: "여행 유형 설명 1번이 여기에 표시됩니다.",
                checklist: ["[체크리스트 항목 1]", "[체크리스트 항목 2]", "[체크리스트 항목 3]"] 
            },
            { 
                title: "[성격 유형 네이밍 2]", 
                desc: "여행 유형 설명 2번이 여기에 표시됩니다.",
                checklist: ["[체크리스트 항목 1]", "[체크리스트 항목 2]", "[체크리스트 항목 3]"] 
            },
            { 
                title: "[성격 유형 네이밍 3]", 
                desc: "여행 유형 설명 3번이 여기에 표시됩니다.",
                checklist: ["[체크리스트 항목 1]", "[체크리스트 항목 2]", "[체크리스트 항목 3]"] 
            },
            { 
                title: "[성격 유형 네이밍 4]", 
                desc: "여행 유형 설명 4번이 여기에 표시됩니다.",
                checklist: ["[체크리스트 항목 1]", "[체크리스트 항목 2]", "[체크리스트 항목 3]"] 
            },
            { 
                title: "[성격 유형 네이밍 5]", 
                desc: "여행 유형 설명 5번이 여기에 표시됩니다.",
                checklist: ["[체크리스트 항목 1]", "[체크리스트 항목 2]", "[체크리스트 항목 3]"] 
            }
        ];

        // 3. [AI 팩폭 데이터 - 사용자 수정 영역]
        const aiCommentsData = Array.from({ length: 108 }, (_, i) => `[AI 팩폭 문구 ${i + 1}번을 입력하세요]`);

        // 4. [추천 지역 데이터 - 사용자 수정 영역]
        const regionsData = [
            "[추천 지역 1번 입력]", 
            "[추천 지역 2번 입력]", 
            "[추천 지역 3번 입력]", 
            "[추천 지역 4번 입력]", 
            "[추천 지역 5번 입력]", 
            "[추천 지역 6번 입력]", 
            "[추천 지역 7번 입력]", 
            "[추천 지역 8번 입력]", 
            "[추천 지역 9번 입력]", 
            "[추천 지역 10번 입력]", 
            "[추천 지역 11번 입력]"
        ];

        // 선택지 단계별 크기(1번 소 ~ 5번 대) 및 텍스트 설정 (5번: 매우 그러함)
        const optionLabels = [
            { score: 1, label: "전혀 아니다", scale: "w-7 h-7 sm:w-8 sm:h-8 text-xs" },
            { score: 2, label: "아니다", scale: "w-8 h-8 sm:w-9 sm:h-9 text-xs" },
            { score: 3, label: "보통이다", scale: "w-9 h-9 sm:w-10 sm:h-10 text-xs sm:text-sm" },
            { score: 4, label: "그러하다", scale: "w-10 h-10 sm:w-11 sm:h-11 text-sm" },
            { score: 5, label: "매우 그러함", scale: "w-11 h-11 sm:w-13 sm:h-13 text-sm sm:text-base" }
        ];

        let currentQuestionIndex = 0;
        let totalScore = 0;
        let selectedScore = null;
        let isTransitioning = false;

        const screenIntro = document.getElementById('screen-intro');
        const screenQuestion = document.getElementById('screen-question');
        const screenResult = document.getElementById('screen-result');
        const qTopicTitle = document.getElementById('q-topic-title');
        const qProgressText = document.getElementById('q-progress-text');
        const progressBar = document.getElementById('progress-bar');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');

        function startTest() {
            currentQuestionIndex = 0;
            totalScore = 0;
            screenIntro.classList.add('hidden');
            screenResult.classList.add('hidden');
            screenQuestion.classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            selectedScore = null;
            isTransitioning = false;
            
            const q = questionsData[currentQuestionIndex];
            qTopicTitle.textContent = q.topic;
            questionText.textContent = `"${q.q}"`;
            
            const progressPercent = ((currentQuestionIndex + 1) / questionsData.length) * 100;
            progressBar.style.width = `${progressPercent}%`;
            qProgressText.textContent = `${currentQuestionIndex + 1} / ${questionsData.length}`;

            renderOptions();
        }

        function renderOptions() {
            optionsContainer.innerHTML = '';
            
            optionLabels.forEach((opt) => {
                const isSelected = selectedScore === opt.score;
                
                const btn = document.createElement('button');
                btn.type = 'button';
                // 수평 원 중심 라인을 정렬하는 전용 슬롯 구조
                btn.className = 'flex flex-col items-center justify-start w-full focus:outline-none py-1';
                btn.onclick = () => answerQuestion(opt.score);

                let circleStyle = isSelected
                    ? 'bg-amber-500 text-white border-2 border-amber-600 shadow-md ring-2 ring-amber-200 scale-105'
                    : 'bg-white text-slate-600 border border-slate-300 hover:border-amber-400 hover:bg-amber-50/50';

                btn.innerHTML = `
                    <div class="h-12 sm:h-14 flex items-center justify-center w-full">
                        <div class="${opt.scale} ${circleStyle} rounded-full flex items-center justify-center font-bold transition-all duration-200 shrink-0">
                            ${opt.score}
                        </div>
                    </div>
                    <span class="text-[10px] sm:text-xs ${isSelected ? 'font-bold text-amber-700' : 'text-slate-500'} mt-1 text-center leading-tight">
                        ${opt.label}
                    </span>
                `;

                optionsContainer.appendChild(btn);
            });
        }

        function answerQuestion(score) {
            if (isTransitioning) return;
            isTransitioning = true;
            
            selectedScore = score;
            renderOptions();

            setTimeout(() => {
                totalScore += score;
                currentQuestionIndex++;

                if (currentQuestionIndex < questionsData.length) {
                    screenQuestion.classList.remove('scale-up');
                    void screenQuestion.offsetWidth;
                    screenQuestion.classList.add('scale-up');
                    loadQuestion();
                } else {
                    showResult();
                }
            }, 220);
        }

        function showResult() {
            screenQuestion.classList.add('hidden');
            screenResult.classList.remove('hidden');

            const resultIndex = totalScore % resultsData.length;
            const currentResult = resultsData[resultIndex];
            
            document.getElementById('result-title').textContent = currentResult.title;
            document.getElementById('result-type-description').textContent = currentResult.desc || "여행 유형 설명이 여기에 표시됩니다.";

            const checklistContainer = document.getElementById('result-checklist');
            checklistContainer.innerHTML = '';
            currentResult.checklist.forEach(item => {
                const li = document.createElement('li');
                li.className = 'flex items-start space-x-2';
                li.innerHTML = `
                    <span class="text-amber-600 font-bold mt-0.5">✓</span>
                    <span>${item}</span>
                `;
                checklistContainer.appendChild(li);
            });

            const aiIndex = (totalScore * 7) % aiCommentsData.length;
            document.getElementById('result-ai-comment').textContent = `"${aiCommentsData[aiIndex]}"`;

            const regionIndex = totalScore % regionsData.length;
            document.getElementById('result-region').textContent = `추천 지역: ${regionsData[regionIndex]}`;
        }

        function showRandomTravelResult() {
            totalScore = Math.floor(Math.random() * 80) + 18;
            screenIntro.classList.add('hidden');
            screenQuestion.classList.add('hidden');
            showResult();
        }

        function restartTest() {
            screenResult.classList.add('hidden');
            screenIntro.classList.remove('hidden');
        }
    </script>
</body>
</html>
